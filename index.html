<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Salamandra City - El Cruce de Cocoyole</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #ff7722;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }
        #hud span {
            color: #ffee00;
        }
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 20;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 204, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            z-index: 30;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* --- GLOBO DE TEXTO BLANCO ESTILO CÓMIC --- */
        #dialogo-box {
            position: absolute;
            bottom: 210px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: #ffffff;
            color: #111111;
            border: 3px solid #000000;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            z-index: 35;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            display: none;
            pointer-events: none;
        }
        #dialogo-box::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
        #dialogo-box::before {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 14px 14px 0;
            border-style: solid;
            border-color: #000000 transparent;
            display: block;
            width: 0;
            z-index: -1;
        }

        .action-btn {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 204, 0, 0.95);
            color: #000;
            border: 2px solid #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            z-index: 30;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }
        #btn-coche {
            background: rgba(50, 220, 80, 0.95);
            color: #000;
        }
        .touch-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="hud">Insectos: <span id="score">0</span> / 15</div>
    <button id="fullscreen-btn">Pantalla Completa ⛶</button>

    <div id="dialogo-box"><b>Don Pepe:</b> Junta 15 insectos y te presto las llaves de la nave para tumbar ese muro.</div>
    <button id="btn-interactuar" class="action-btn">Hablar con Don Pepe 💬</button>
    <button id="btn-coche" class="action-btn">Subir al coche y tumbar muro 🛻</button>

    <div class="touch-hint">Arrastra la pantalla derecha para mirar alrededor</div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { crearSalamandra, actualizarAnimacion } from './assets/modelos/salamandra.js';
        import { generarMundo } from './assets/modelos/world.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xff7722);
        scene.fog = new THREE.FogExp2(0xff7722, 0.025);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 150);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffaa55, 1.1);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff4400, 1.5);
        dirLight.position.set(40, 30, 40);
        scene.add(dirLight);

        const clock = new THREE.Clock();

        // --- GENERAR MUNDO MODULARIZADO ---
        const { 
            obstaculosColisiones, 
            insectos, 
            crearInsecto, 
            mixersAnimaciones, 
            cocheCtrl, 
            muroDestructible 
        } = generarMundo(scene);

        const salamandra = crearSalamandra();
        scene.add(salamandra);

        // --- CONTROLES TÁCTILES ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const btnInteractuar = document.getElementById('btn-interactuar');
        const btnCoche = document.getElementById('btn-coche');
        const dialogoBox = document.getElementById('dialogo-box');
        const posicionPollero = new THREE.Vector3(0, 0, -33.2);
        const posicionCoche = new THREE.Vector3(4.5, 0, -24);

        let joyVector = { x: 0, y: 0 };
        let joystickTouchId = null;
        let lookTouchId = null;

        let lastLookX = 0;
        let lastLookY = 0;
        let yaw = 0;
        let pitch = 0;
        const maxRadius = 40;

        // Estados de la cinemática del coche
        let enCinematicaCoche = false;
        let muroDerribado = false;
        let velocidadCoche = 0;

        window.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                const rect = joystickZone.getBoundingClientRect();
                const isInsideJoystick = (
                    touch.clientX >= rect.left && touch.clientX <= rect.right &&
                    touch.clientY >= rect.top && touch.clientY <= rect.bottom
                );

                if (isInsideJoystick && joystickTouchId === null) {
                    joystickTouchId = touch.identifier;
                    updateJoystick(touch);
                } else if (touch.clientX > window.innerWidth / 3 && lookTouchId === null) {
                    lookTouchId = touch.identifier;
                    lastLookX = touch.clientX;
                    lastLookY = touch.clientY;
                }
            }
        });

        function updateJoystick(touch) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            let dist = Math.hypot(deltaX, deltaY);

            if (dist > maxRadius) {
                deltaX = (deltaX / dist) * maxRadius;
                deltaY = (deltaY / dist) * maxRadius;
            }

            joystickKnob.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
            joyVector.x = deltaX / maxRadius;
            joyVector.y = deltaY / maxRadius;
        }

        window.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    updateJoystick(touch);
                } else if (touch.identifier === lookTouchId) {
                    const deltaX = touch.clientX - lastLookX;
                    const deltaY = touch.clientY - lastLookY;

                    yaw -= deltaX * 0.005;
                    pitch -= deltaY * 0.005;
                    pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));

                    lastLookX = touch.clientX;
                    lastLookY = touch.clientY;
                }
            }
        });

        function resetTouch(e) {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    joyVector = { x: 0, y: 0 };
                    joystickKnob.style.transform = `translate(-50%, -50%)`;
                } else if (touch.identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        }

        window.addEventListener('touchend', resetTouch);
        window.addEventListener('touchcancel', resetTouch);

        const fsBtn = document.getElementById('fullscreen-btn');
        fsBtn.addEventListener('click', async () => {
            try {
                const elem = document.documentElement;
                if (elem.requestFullscreen) await elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) await elem.webkitRequestFullscreen();
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (err) {}
        });

        // --- DIÁLOGO DON PEPE ---
        let turnoDialogo = 0;
        const frasesPollero = [
            "<b>Don Pepe:</b> Junta 15 insectos y te presto la nave para tumbar ese pedazo de muro.",
            "<b>Don Pepe:</b> Ya que tengas los 15, acércate al coche y súbete en chinga.",
            "<b>Don Pepe:</b> ¡Písale a fondo para abrir el boquete hacia Cocoyole!"
        ];

        btnInteractuar.addEventListener('click', () => {
            turnoDialogo = (turnoDialogo + 1) % frasesPollero.length;
            dialogoBox.innerHTML = frasesPollero[turnoDialogo];
        });

        // --- ACTIVAR CINEMÁTICA DE SUBIR AL COCHE Y TUMBAR MURO ---
        btnCoche.addEventListener('click', () => {
            if (score >= 15 && !enCinematicaCoche && !muroDerribado) {
                enCinematicaCoche = true;
                btnCoche.style.display = 'none';
                btnInteractuar.style.display = 'none';
                dialogoBox.style.display = 'none';

                // Quitamos la colisión del coche estacionado
                const idx = obstaculosColisiones.findIndex(o => o.id === 'coche');
                if (idx !== -1) obstaculosColisiones.splice(idx, 1);
            }
        });

        // --- COLISIONES BLINDADAS CON MURO FRONTERIZO ---
        const MARGEN_COLISION = 0.3;

        function puedeMoverseA(x, z) {
            if (Math.abs(x) > 33 || z > 33) return false;

            // Si el muro NO ha sido derribado, bloquea todo Z < -33.5
            if (!muroDerribado) {
                if (z < -33.5) return false;
            } else {
                // Si YA se tumbó el muro, permitimos cruzar por el hueco (X entre 1.8 y 7.2)
                const enHueco = (x > 1.8 && x < 7.2);
                if (!enHueco && z < -33.5) return false;
                if (z < -58) return false; // Límite del otro lado de la frontera
            }

            for (let obs of obstaculosColisiones) {
                const dist = Math.hypot(x - obs.x, z - obs.z);
                if (dist < (obs.radio + MARGEN_COLISION)) {
                    return false;
                }
            }
            return true;
        }

        let score = 0;
        const scoreElement = document.getElementById('score');
        const velocidad = 0.08;

        function actualizarCinematicaCoche() {
            const coche = cocheCtrl.getMesh();
            if (!coche) return;

            // Aceleración progresiva hacia el muro (-Z)
            velocidadCoche += 0.015;
            coche.position.z -= velocidadCoche;

            // Pegamos la salamandra al techo/asiento del coche
            salamandra.position.set(coche.position.x, 0.8, coche.position.z);

            // Cámara en tercera persona viendo el madrazo
            camera.position.set(coche.position.x + 3.5, 3.0, coche.position.z + 6.5);
            camera.lookAt(coche.position.x, 1.0, coche.position.z - 4);

            // Impacto contra el muro (Z <= -33.5)
            if (coche.position.z <= -33.5 && !muroDerribado) {
                muroDerribado = true;
            }

            // Animar la caída del pedazo de muro derribado
            if (muroDerribado && muroDestructible.rotation.x > -Math.PI / 2) {
                muroDestructible.rotation.x -= 0.08;
                muroDestructible.position.z -= 0.15;
            }

            // Cuando el coche ya cruzó al otro lado (Z <= -42), bajamos a la salamandra en el hueco
            if (coche.position.z <= -42) {
                enCinematicaCoche = false;
                salamandra.position.set(4.5, 0, -35); // Ya cruzando la frontera
                yaw = Math.PI; // Mirando hacia el nuevo territorio
                pitch = 0;
                dialogoBox.innerHTML = "<b>¡A huevo!</b> Tumbaron el muro. Ya puedes cruzar hacia Cocoyole.";
                dialogoBox.style.display = 'block';
                setTimeout(() => { dialogoBox.style.display = 'none'; }, 4000);
            }
        }

        function updatePlayer() {
            if (enCinematicaCoche) {
                actualizarCinematicaCoche();
                return;
            }

            let moviendose = false;

            if (Math.hypot(joyVector.x, joyVector.y) > 0.1) {
                moviendose = true;

                const moveX = -joyVector.x;
                const moveZ = joyVector.y;

                const sinYaw = Math.sin(yaw);
                const cosYaw = Math.cos(yaw);

                const deltaX = (sinYaw * (-moveZ) + cosYaw * moveX) * velocidad;
                const deltaZ = (cosYaw * (-moveZ) - sinYaw * moveX) * velocidad;

                const nuevoX = salamandra.position.x + deltaX;
                const nuevoZ = salamandra.position.z + deltaZ;

                if (puedeMoverseA(nuevoX, salamandra.position.z)) {
                    salamandra.position.x = nuevoX;
                }
                if (puedeMoverseA(salamandra.position.x, nuevoZ)) {
                    salamandra.position.z = nuevoZ;
                }
            }

            salamandra.rotation.y = yaw;
            actualizarAnimacion(salamandra, moviendose);

            // --- PROXIMIDAD CON DON PEPE ---
            const distanciaPollero = salamandra.position.distanceTo(posicionPollero);
            if (distanciaPollero < 3.5) {
                btnInteractuar.style.display = 'block';
                dialogoBox.style.display = 'block';
                if (score >= 15 && !muroDerribado) {
                    dialogoBox.innerHTML = "<b>Don Pepe:</b> ¡Ya juntaste los 15 insectos! Súbete al coche de al lado y dale en su madre al muro.";
                }
            } else {
                btnInteractuar.style.display = 'none';
                if (!muroDerribado) dialogoBox.style.display = 'none';
            }

            // --- PROXIMIDAD CON EL COCHE (REQUIERE 15 INSECTOS) ---
            const distanciaCoche = salamandra.position.distanceTo(posicionCoche);
            if (distanciaCoche < 4.0 && !muroDerribado) {
                if (score >= 15) {
                    btnCoche.style.display = 'block';
                } else {
                    dialogoBox.innerHTML = `<b>Coche bloqueado:</b> Te faltan ${15 - score} insectos para que Don Pepe te dé las llaves.`;
                    dialogoBox.style.display = 'block';
                }
            } else {
                btnCoche.style.display = 'none';
            }

            const alturaOjos = 1.25;
            camera.position.x = salamandra.position.x;
            camera.position.y = salamandra.position.y + alturaOjos;
            camera.position.z = salamandra.position.z;

            const targetX = camera.position.x + Math.sin(yaw) * Math.cos(pitch);
            const targetY = camera.position.y + Math.sin(pitch);
            const targetZ = camera.position.z + Math.cos(yaw) * Math.cos(pitch);

            camera.lookAt(targetX, targetY, targetZ);

            for (let i = insectos.length - 1; i >= 0; i--) {
                const ins = insectos[i];
                if (salamandra.position.distanceTo(ins.position) < 0.8) {
                    scene.remove(ins);
                    insectos.splice(i, 1);
                    score++;
                    scoreElement.innerText = score;
                    crearInsecto();
                }
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (mixersAnimaciones && mixersAnimaciones.length > 0) {
                mixersAnimaciones.forEach(mixer => mixer.update(delta));
            }

            updatePlayer();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
