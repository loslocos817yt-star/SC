<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Salamandra City </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #ff7722;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }
        #hud span {
            color: #ffee00;
        }
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 20;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 204, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            z-index: 30;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* --- GLOBO DE TEXTO BLANCO ESTILO CÓMIC --- */
        #dialogo-box {
            position: absolute;
            bottom: 210px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: #ffffff;
            color: #111111;
            border: 3px solid #000000;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            z-index: 35;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            display: none;
            pointer-events: none;
        }
        #dialogo-box::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
        #dialogo-box::before {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 14px 14px 0;
            border-style: solid;
            border-color: #000000 transparent;
            display: block;
            width: 0;
            z-index: -1;
        }

        .action-btn {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 204, 0, 0.95);
            color: #000;
            border: 2px solid #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            z-index: 30;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }
        #btn-coche {
            background: rgba(50, 220, 80, 0.95);
            color: #000;
        }
        .touch-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="hud">Insectos: <span id="score">0</span> / 15</div>
    <button id="fullscreen-btn">Pantalla Completa ⛶</button>

    <div id="dialogo-box"><b>Don Pepe:</b> Junta 15 insectos y te presto las llaves de la nave para tumbar ese muro.</div>
    <button id="btn-interactuar" class="action-btn">Hablar con Don Pepe 💬</button>
    <button id="btn-coche" class="action-btn">Subir al coche y tumbar muro 🛻</button>

    <div class="touch-hint">Arrastra la pantalla derecha para mirar alrededor</div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="canvas-container"></div>

    <!-- CARGAMOS EL JUEGO DESDE EL MÓDULO EXTERNO -->
    <script type="module" src="./assets/modelos/main.js"></script>
</body>
</html>
